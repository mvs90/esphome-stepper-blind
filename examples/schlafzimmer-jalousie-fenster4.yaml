esphome:
  name: schlafzimmer-jalousie-fenster4
  friendly_name: schlafzimmer-jalousie-fenster4
esp8266:
  board: d1_mini
  restore_from_flash: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
stepper:
  - platform: uln2003
    id: my_stepper
    pin_a: D0
    pin_b: D5
    pin_c: D6
    pin_d: D7
    max_speed: 250 steps/s
    sleep_when_done: true

cover:
  - platform: stepper_blind
    id: blinded
    name: Schlafzimmer Jalousie Fenster 4
    device_class: blind
    stepper_id: my_stepper
    closed_position: 10000
    endstop:
      name: Endstop
      id: hass_endstop
      entity_category: config
external_components:
  - source: github://mvs90/esphome-stepper-blind@v0.1.0
    components:
      - stepper_blind
